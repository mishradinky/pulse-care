[project]
name = "pulse-care"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "openai>=1.50.0",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0.2",
  "pandas>=2.2.3",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "jsonschema>=4.23",
  "rich>=13.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
